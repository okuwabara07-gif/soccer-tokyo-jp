name: Instagram自動投稿 - 関東ジュニアサッカー情報局

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      image_url:
        description: '投稿する画像URL（省略時はデフォルト）'
        required: false
        type: string

jobs:
  post-to-instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 投稿実行
        env:
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAGE_URL: ${{ github.event.inputs.image_url || secrets.DEFAULT_IMAGE_URL }}
        run: node instagram-auto-post/post-instagram.js

      - name: 結果記録
        if: always()
        run: |
          echo "## 投稿結果" >> $GITHUB_STEP_SUMMARY
          echo "- 日時: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')" >> $GITHUB_STEP_SUMMARY
          echo "- ステータス: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
