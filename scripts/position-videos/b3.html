<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="lib.css"></head>
<body>
<canvas id="c"></canvas>
<div id="labs"></div>
<div id="top" class="ov">
  <div id="series"><span class="tag">8人制</span>3バックの守り方</div>
  <div id="bar"><div><i></i></div><div><i></i></div><div><i></i></div></div>
  <div id="step"></div>
</div>
<div id="badge" class="ov"></div>
<div id="cap" class="ov"><div class="box"></div></div>
<div id="card" class="ov"><div></div></div>
<div id="brand" class="ov">soccer-selection.jp</div>
<div id="title" class="ov"><div class="k">8人制で勝ちたい君へ</div><div class="t">8人制の3バック<br><span>崩されない</span><br>3つのコツ</div></div>
<div id="end" class="ov">
  <h2>まとめ</h2>
  <div class="row"><div class="n">1</div><span>3人で<em>ボール側にずれる</em></span></div>
  <div class="row"><div class="n">2</div><span>1人が行き<em>2人はカバー</em></span></div>
  <div class="row"><div class="n">3</div><span><em>ラインをそろえる</em></span></div>
  <div class="foot">保存して次の練習で試そう</div>
  <div class="follow">フォローで<br>全ポジションのコツが届く<span>@soccer_kanto_jp</span></div>
  <div class="next">次回：8人制の攻め方編</div>
  <div class="site">soccer-selection.jp</div>
</div>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import {THREE,scene,cam,renderer,line,circleLine,stand,goal,player,pose,face,makeBall,placeBall,decal,setOp,arrowGeo,aimArrow,tri,setTri,cl,ss,lerp,fade,V,camKeys,ovOp,label,chapters,timed} from './lib.js';

// 8人制コート（68x50）: 自陣ゴール z=+24、センターライン z=-10
line(-25,24,25,24);line(-25,-44,-25,24);line(25,-44,25,24);line(-25,-10,25,-10);circleLine(0,-10,7);
line(-10,24,-10,12);line(10,24,10,12);line(-10,12,10,12);
stand(0,-40,0);stand(32,0,Math.PI/2);stand(-32,0,Math.PI/2);goal(24);
const BL=[player(0x1f5fbf,0x0d2a4a),player(0x1f5fbf,0x0d2a4a),player(0x1f5fbf,0x0d2a4a)];
const gk=player(0x2bb35e,0x111111,0x2bb35e);
const AT=[player(0xf2f2f2,0xd33b3b),player(0xf2f2f2,0xd33b3b),player(0xf2f2f2,0xd33b3b)];
const ball=makeBall();
const gapA=decal(new THREE.PlaneGeometry(1,0.5),0xffd34d), gapB=decal(new THREE.PlaneGeometry(1,0.5),0xffd34d);
const hole=decal(new THREE.CircleGeometry(2.6,40),0xe23b3b);
const cover=tri(0x2ec4e6);
const lineY=decal(new THREE.PlaneGeometry(50,0.2),0xffd34d);
const run=decal(arrowGeo(5,0.4,1.0),0xe23b3b), slide=decal(arrowGeo(3,0.45,1.0),0x2ec4e6);
const rings=BL.map(()=>decal(new THREE.RingGeometry(0.75,1.0,40),0x2ec4e6));

const camAt=camKeys([
 [0,V(-4,30,40),V(-3,0,0)],[2.6,V(-5,26,36),V(-4,0,3)],
 [3.2,V(-4.5,19,26),V(-4,0,6)],[15.2,V(-4.5,19,26),V(-4,0,6)],
 [16.0,V(1.8,19,27),V(2.0,0,7)],[25.4,V(1.8,19,27),V(2.0,0,7)],
 [26.2,V(-1.5,19,30),V(-1.5,0,9.5)],[36,V(-1.5,19,30),V(-1.5,0,9.5)],[40,V(-1.5,19,30),V(-1.5,0,9.5)]]);

function seg(g,a,b,op){const mx=(a[0]+b[0])/2,mz=(a[1]+b[1])/2,L=Math.hypot(b[0]-a[0],b[1]-a[1]);g.position.set(mx,0,mz);g.userData.m.scale.set(L,1,1);g.userData.m.rotation.z=-Math.atan2(b[1]-a[1],b[0]-a[0]);setOp(g,op);}

window.render=function(t){
 let D=[[-8,10],[0,10],[8,10]],A=[[-14,-4],[-4,-2],[8,-2]],run_=[0,0,0],arun=[0,0,0];
 let bx,bz,by=0.13,ballOwner=0,ballFree=false;
 let gapOp=0,holeOp=0,coverOp=0,lineOp=0,runOp=0,slideOp=0,holeP=[0,0],runA=[0,0,0,1];
 // ---------- ① NG ----------
 if(t<8.75){
  const k=ss(3.4,5.6,t);A[0]=[lerp(-14,-13,k),lerp(-4,2,k)];arun[0]=t>3.4&&t<5.6?0.6:0;
  D[0]=[lerp(-8,-11,ss(3.8,5.6,t)),10];run_[0]=t>3.8&&t<5.6?0.3:0;
  const r=ss(5.8,7.6,t);A[1]=[lerp(-4,-5.5,r),lerp(-2,13,r)];arun[1]=t>5.8&&t<7.6?0.8:0;
  holeP=[(D[0][0]+D[1][0])/2,10];holeOp=fade(t,4.6,8.5);
  if(t>6.2){ballFree=true;const s=ss(6.2,7.4,t);bx=lerp(A[0][0]+0.4,-5.6,s);bz=lerp(A[0][1]+0.4,12.6,s);}
  gapOp=fade(t,4.0,6.2);runA=[-4.5,-1,-0.1,1];runOp=fade(t,5.6,7.8);
 }
 // ---------- ① OK ----------
 else if(t<15.4){
  const k=ss(9.4,11.4,t);A[0]=[lerp(-14,-13,k),lerp(-4,2,k)];arun[0]=t>9.4&&t<11.4?0.6:0;
  const s=ss(9.8,11.8,t);D=[[lerp(-8,-11,s),lerp(10,9,s)],[lerp(0,-5,s),10],[lerp(8,1,s),lerp(10,10.5,s)]];run_=[0.3,0.3,0.3].map(v=>t>9.8&&t<11.8?v:0);
  const r=ss(12.2,13.6,t);A[1]=[lerp(-4,-5,r),lerp(-2,5,r)];arun[1]=t>12.2&&t<13.6?0.7:0;
  gapOp=fade(t,11.8,15.2);slideOp=fade(t,9.6,12.0);
 }
 // ---------- ② ----------
 else if(t<25.8){
  ballOwner=1;
  const nok=t<19.9;const t0=nok?16.3:20.4;
  const k=ss(t0,t0+1.8,t);A[1]=[0,lerp(-1,3,k)];arun[1]=k>0&&k<1?0.6:0.05;
  A[0]=[-12,1];A[2]=[10,1];
  if(nok){
   const g=ss(16.8,18.2,t);D=[[-8,10],[0,lerp(10,5.5,g)],[lerp(8,2,g),lerp(10,6.5,g)]];run_=[0,g>0&&g<1?0.5:0,g>0&&g<1?0.5:0];
   const r=ss(18.0,19.6,t);A[2]=[lerp(10,9,r),lerp(1,12,r)];arun[2]=t>18&&t<19.6?0.8:0;
   if(t>18.4){ballFree=true;const s=ss(18.4,19.4,t);bx=lerp(0.4,9,s);bz=lerp(3.4,11.6,s);}
   holeP=[8,11];holeOp=fade(t,18.0,19.8);
  }else{
   const g=ss(20.8,22.2,t);D=[[lerp(-8,-4,g),lerp(10,9.5,g)],[0,lerp(10,5.5,g)],[lerp(8,4,g),lerp(10,9.5,g)]];run_=[g>0&&g<1?0.35:0,g>0&&g<1?0.5:0,g>0&&g<1?0.35:0];
   coverOp=fade(t,21.6,25.3);
  }
 }
 // ---------- ③ ----------
 else{
  ballOwner=1;
  const nok=t<30.5;A[1]=[0,2];A[0]=[-13,3];
  if(nok){D=[[-8,14],[0,10],[8,10]];A[2]=[-5,12.3];}
  else{D=[[-8,10.4],[0,10.4],[8,10.4]];A[2]=[-5,12.3];}
  lineOp=nok?0:fade(t,31.0,35.8);
  const tp=nok?28.4:33.0, dur=nok?1.2:2.2;
  if(t>tp){ballFree=true;const s=ss(tp,tp+dur,t);bx=lerp(0.4,-5,s);bz=lerp(2.4,15.5,s);
   if(nok){const r=ss(tp,tp+dur,t);A[2]=[-5,lerp(12.3,15.2,r)];arun[2]=r>0&&r<1?0.7:0;}}
 }
 // ---------- place ----------
 const SX=0.75;D=D.map(q=>[q[0]*SX,q[1]]);A=A.map(q=>[q[0]*SX,q[1]]);if(ballFree)bx*=SX;holeP=[holeP[0]*SX,holeP[1]];runA=[runA[0]*SX,runA[1],runA[2],runA[3]];
 BL.forEach((p,i)=>{p.position.set(D[i][0],0,D[i][1]);p.rotation.y=face(A[ballOwner][0]-D[i][0],A[ballOwner][1]-D[i][1]);pose(p,{run:run_[i],phase:t*8+i,crouch:0.6});rings[i].position.set(D[i][0],0,D[i][1]);setOp(rings[i],0.85*fade(t,3.2,36));});
 AT.forEach((p,i)=>{p.position.set(A[i][0],0,A[i][1]);p.rotation.y=face(0-A[i][0],24-A[i][1]);pose(p,{run:arun[i],phase:t*9+i,crouch:0.15});});
 gk.position.set(0,0,22);gk.rotation.y=Math.PI;pose(gk,{crouch:0.8});
 if(!ballFree){bx=A[ballOwner][0]+0.1;bz=A[ballOwner][1]+0.45;}
 placeBall(ball,bx,bz,by);
 seg(gapA,D[0],D[1],0.85*gapOp);seg(gapB,D[1],D[2],0.85*gapOp);
 hole.position.set(holeP[0],0,holeP[1]);setOp(hole,0.45*holeOp);
 setTri(cover,D[0],D[1],D[2],0.03);cover.material.opacity=0.35*coverOp;
 lineY.position.set(0,0,10.4);setOp(lineY,0.9*lineOp);
 aimArrow(run,runA[0],runA[1],runA[2],runA[3]);setOp(run,0.85*runOp);
 aimArrow(slide,3,13.5,-1,0);setOp(slide,0.85*slideOp);

 camAt(t);renderer.render(scene,cam);

 ovOp('title',fade(t,0,2.8,0.4));ovOp('top',ss(2.6,3.0,t)*(1-ss(36,36.4,t)));ovOp('end',ss(36,36.6,t));
 chapters(t,[[2.8,15.4,'<b>①</b> ずれる'],[15.4,25.6,'<b>②</b> カバー'],[25.6,36,'<b>③</b> ライン']]);
 timed('card',t,[[15.3,16.2,'<small>STEP 2</small>カバー'],[25.5,26.3,'<small>STEP 3</small>ライン']],'div');
 timed('badge',t,[[3.4,8.5,'NG','ng'],[8.6,9.3,'もう一度','re'],[9.4,15.2,'OK','ok'],[16.3,19.8,'NG','ng'],[19.9,20.4,'もう一度','re'],[20.5,25.3,'OK','ok'],[26.4,30.2,'NG','ng'],[30.3,30.9,'もう一度','re'],[31.0,32.9,'OK','ok'],[33.0,35.2,'スロー','slow']]);
 timed('cap',t,[[3.5,6.0,'ボールの方に<br><em>1人だけ</em>動くと…'],[6.0,8.5,'3人の<em>間が空いて</em><br>通される'],
   [9.5,12.0,'3人<em>いっしょに</em><br>ボール側へずれる'],[12.0,15.2,'間が<em>同じ距離</em>なら<br>通されない'],
   [16.3,18.2,'ボールに<em>2人</em>行くと…'],[18.2,19.8,'<em>後ろが空いて</em><br>パス1本で終わる'],
   [20.5,22.6,'<em>1人</em>がボールへ'],[22.6,25.3,'残り2人は<br><em>ななめ後ろ</em>でカバー'],
   [26.5,28.4,'<em>1人だけ</em>下がっていると…'],[28.4,30.2,'<em>オフサイドにならず</em><br>裏を取られる'],
   [31.0,33.0,'3人の<em>ラインをそろえる</em>'],[33.0,36,'裏に走った相手は<br><em>オフサイド</em>']],'.box');
 label('gap','r','ここが空いた',V(holeP[0],0.4,holeP[1]+0.5),fade(t,5.0,8.5));
 label('same','y','同じ距離',V((D[0][0]+D[1][0])/2,0.4,D[1][1]+1.6),fade(t,12.0,15.2));
 label('slide','c','3人でずれる',V(3,0.4,11.5),fade(t,9.8,12.0));
 label('two','r','2人で行ってしまう',V(1.5,3.0,6),fade(t,16.9,18.4));
 label('empty','r','誰もいない',V(5,0.4,13.5),fade(t,18.2,19.8));
 label('go','y','1人が行く',V(D[1][0],3.0,D[1][1]),fade(t,21.0,25.3));
 label('cov','c','2人はカバー',V(0,0.4,11.5),fade(t,22.0,25.3));
 label('deep','r','1人だけ下がっている',V(-5,2.8,14),fade(t,26.5,30.2));
 label('line','y','ラインをそろえる',V(1.5,0.4,9),fade(t,31.2,35.8));
 label('off','r','オフサイド！',V(A[2][0],3.0,A[2][1]),fade(t,34.0,36,0.15));
};
window.ready=true;
</script></body></html>
