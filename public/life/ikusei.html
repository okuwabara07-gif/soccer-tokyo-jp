function choosePos(k){

function projFat(){ let f = S.fat; for (const id of plan) f += DRILLS.find(d=>d.id===id).fat; return clamp(f,0,100); }

function pickEvent(){
  const k = SEASONS[S.i].k; const pool = EVENTS.filter(e => e.k===k && !S.flags["ev"+EVENTS.indexOf(e)]);
  const e = pool[Math.floor(R()*pool.length)] || EVENTS.filter(e=>e.k===k)[0];
  S.flags["ev"+EVENTS.indexOf(e)] = 1; return e;
}
function eventHtml(){
  if (!evPending){ evPending = pickEvent(); evDone = false; }
  const e = evPending;
  if (evDone) return `<div class="card ev"><div class="who"><span class="face">${e.face}</span><span><b>${e.who}</b><span>${SEASONS[S.i].g}の出来事</span></span></div><p class="res">${e._res||""}</p></div>`;
  return `<div class="card ev"><div class="who"><span class="face">${e.face}</span><span><b>${e.who}</b><span>${SEASONS[S.i].g}の出来事・1つ選ぶ</span></span></div><p>${e.t}</p><div class="opts">${e.o.map((o,i)=>`<button class="opt" data-i="${i}"><b>${o[0]}</b>${o[1]?`<span>${o[1]}</span>`:""}</button>`).join("")}</div></div>`;
}
function resolveEvent(i){
  const e = evPending, o = e.o[i]; let res = e.res ? e.res[i] : "";
  S.prev = {...S.s};
  if (o[2]) applyFx(o[2]);
  if (o[4]) S.fat = clamp(S.fat + o[4], 0, 100);
  addTr(o[5]); if (o[6]) quote(o[6]);
  if (o[3]==="duel"){ const win = ovr(S.s) + R()*12 > S.rival.ovr + R()*12; if (win){ S.flags.rival = 1; applyFx({men:3,tec:1}); res = "1対1で勝った。ハヤトが本気で悔しがっていた。"; toast("ライバルに勝った"); quote("rival"); } else { applyFx({tec:2}); res = "負けた。でも、何が足りないかが分かった。"; } }
  if (o[3]==="scout1"){ if (R() < 0.35 + S.s.tec/250){ S.flags.scout = 2; res = "ヒールリフトが決まり、スカウトがメモを取った。"; toast("スカウトの評価が上がった"); } else { S.flags.scout = -1; res = "ボールを奪われて失点。監督に交代させられた。"; } }

  if (o[3]==="captain"){ S.flags.captain = 1; }
  e._res = res || `「${o[0]}」を選んだ。`;
  addLog(null, `${e.who}：${o[0]}`);
  evDone = true; render();
}
function applyFx(fx, mult=1){ for (const [k,v] of Object.entries(fx)) S.s[k] = clamp(Math.round(S.s[k] + v*mult), 1, 99); }

function runSeason(){

function proEntry(path, sc){

// タイミングゲーム（ファーストタッチ）
function timingGame(o){
  const inn = $("bigIn");
  inn.innerHTML = `<span class="eyebrow" style="color:var(--navy-dim)">大一番</span><h2>${o.title}</h2><p>${o.sub}</p>
    <canvas id="tg" width="900" height="300" aria-label="ボールが来たらタップ"></canvas>
    <div class="score num" id="tgS">成功 0 / ${o.tries}</div><p class="hint">枠の広さはテクニック、ボールの速さはスピードで変わります。画面をタップ（スペースキーでも可）。</p>`;
  const c = $("tg"), x = c.getContext("2d"); let t = 0, dir = 1, hits = 0, tries = 0, lock = false, raf;
  const zw = clamp(o.zone, 5, 40), zc = 50 + (R()-0.5)*30;
  const draw = () => {
    x.clearRect(0,0,900,300);
    x.fillStyle = "rgba(255,255,255,.06)"; x.fillRect(0,0,900,300);
    x.strokeStyle = "rgba(255,255,255,.18)"; x.lineWidth = 4; x.beginPath(); x.moveTo(0,150); x.lineTo(900,150); x.stroke();
    x.fillStyle = "rgba(255,138,76,.28)"; x.fillRect((zc-zw/2)*9, 40, zw*9, 220);
    x.strokeStyle = "#ff8a4c"; x.lineWidth = 4; x.strokeRect((zc-zw/2)*9, 40, zw*9, 220);
    const bx = t*9; x.fillStyle = "#eef2f8"; x.beginPath(); x.arc(bx, 150, 26, 0, Math.PI*2); x.fill();
    x.strokeStyle = "#14213a"; x.lineWidth = 3; x.beginPath(); x.arc(bx, 150, 12, 0, Math.PI*2); x.stroke();
  };
  const loop = () => { if (!lock){ t += dir * (1.6 / Math.max(0.45, o.speed)); if (t>100){t=100;dir=-1;} if (t<0){t=0;dir=1;} } draw(); raf = requestAnimationFrame(loop); };
  const hit = () => {
    if (lock || tries>=o.tries) return; lock = true; tries++;
    const ok = Math.abs(t - zc) <= zw/2; if (ok) hits++;
    beep(ok); $("tgS").textContent = `成功 ${hits} / ${o.tries}`;
    setTimeout(() => { lock = false; t = R()<.5?0:100; dir = t===0?1:-1;
      if (tries>=o.tries || hits>=o.need || o.tries-tries < o.need-hits){ cancelAnimationFrame(raf); window.removeEventListener("keydown", key); const pass = hits>=o.need; o.done(pass); verdict(pass, pass?"合格":"不合格"); } }, 650);
  };
  const key = e => { if (e.code==="Space"){ e.preventDefault(); hit(); } };
  c.onpointerdown = hit; window.addEventListener("keydown", key); loop();
}

function drawGoal(x, G, kx, ball, keeperColor){
  x.clearRect(0,0,900,560);
  x.fillStyle = "rgba(255,255,255,.05)"; x.fillRect(0,0,900,560);
  x.strokeStyle = "rgba(255,255,255,.2)"; x.lineWidth = 2;
  for (let i=1;i<6;i++){ x.beginPath(); x.moveTo(G.x+i*G.w/6, G.y); x.lineTo(G.x+i*G.w/6, G.y+G.h); x.stroke(); }
  for (let j=1;j<4;j++){ x.beginPath(); x.moveTo(G.x, G.y+j*G.h/4); x.lineTo(G.x+G.w, G.y+j*G.h/4); x.stroke(); }
  x.strokeStyle = "#eef2f8"; x.lineWidth = 10; x.strokeRect(G.x, G.y, G.w, G.h);
  x.fillStyle = "rgba(255,255,255,.08)"; x.fillRect(0, G.y+G.h, 900, 190);
  x.fillStyle = keeperColor; x.beginPath(); x.ellipse(kx, G.y+G.h-70, 34, 70, 0, 0, Math.PI*2); x.fill();
  x.fillStyle = "#14213a"; x.beginPath(); x.arc(kx, G.y+G.h-150, 24, 0, Math.PI*2); x.fill();
  x.fillStyle = "#eef2f8"; x.beginPath(); x.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); x.fill();
}

    const gkGuess = R() < clamp(0.42 - S.s.iq/400 + (1-edge)*0.25, 0.12, 0.6) ? aim.x : (R()<.5 ? G.x+90 : G.x+G.w-90);

      drawGoal(x, G, kx, {x:450+(shotX-450)*p, y:500+(shotY-500)*p, r:18-6*p}, "#8ab8f0"); if (p < 1) return requestAnimationFrame(go);
      beep(save); if (save) S.flags.gk = 1; pkResult(save, save?"止めた！":"決められた", "逆を突かれた。全国まであと1本だった。"); };
    requestAnimationFrame(go);
  };
}
function pkResult(win, word, loseLine){
  if (win){ S.flags.pk = 1; S.flags.senshu = 1; addLog("good", "PK戦に勝ち、全国高校サッカー選手権への出場が決まった。"); quote("goal"); }
  else { addLog("bad", loseLine); quote("miss"); }

}
function verdict(ok, word, quiet){
  const inn = $("bigIn");
  inn.insertAdjacentHTML("beforeend", `<div class="verdict ${ok?"ok":"ng"}">${word}</div><button class="btn main" id="bigNext">${S.i>=SEASONS.length-1?"進路を決める":"次のシーズンへ"}</button>`);
  if (ok && !quiet) confetti();
  $("bigNext").onclick = () => { closeBig(); nextSeason(); };
  $("bigNext").focus();
}

// ── 高3の冬：最後の進路 ───────────────────────────────
function score(){ return ovr(S.s) + (S.flags.scout||0)*3 + S.skills.length*1.5 + (S.flags.pk?3:0) + ({"JクラブU-18":6,"海外のアカデミー":6,"強豪校":4}[S.team]||0); }

  inn.querySelectorAll(".route").forEach(b => b.onclick = () => { const r = b.dataset.r; const e = proEntry(r, sc); if (e) return proChapter(e, res => finish(r, sc, res)); closeBig(); finish(r, sc); });
}

// ── 結末 ─────────────────────────────────────────────
function aptitude(){
  const s = S.s, t = S.tr, A = {};
  A.coach = (t.coach||0)*6 + s.iq*0.5 + s.men*0.4 + (S.flags.captain?8:0);
  A.analyst = (t.analyst||0)*7 + s.iq*0.8;
  A.trainer = (t.trainer||0)*6 + s.phy*0.4 + S.injuries*6;
  A.ref = (t.ref||0)*8 + s.men*0.5 + s.iq*0.3;
  A.media = (t.media||0)*6 + s.iq*0.3 + S.quotes.length*1.5;
  A.gear = (t.gear||0)*7 + s.tec*0.6;
  A.front = (t.front||0)*7 + s.men*0.3 + (S.flags.captain?10:0);
  A.nutri = (t.nutri||0)*7 + s.phy*0.3;
  const max = Math.max(...Object.values(A));
  const min = Math.min(...Object.values(A));
  return Object.entries(A).map(([k,v]) => [k, Math.round(40 + 56*(v-min)/Math.max(1,max-min))]).sort((a,b)=>b[1]-a[1]);
}
function finish(path, sc, PR){

  if (PR){ end = PR.end; tier = 4; }

  const apt = aptitude(); const top = apt.slice(0,3);

  const fut = future(path, tier, top[0][0]);
  app.innerHTML = `
    <div class="card end"><span class="eyebrow" style="color:var(--navy-dim)">${S.name?esc(S.name)+"・":""}高3の冬・結末${newEnd?"（新しい結末）":""}</span><h2>${end}</h2>
      <div class="row" style="gap:18px"><span><span class="eyebrow" style="color:var(--navy-dim)">総合力</span><br><b class="num" style="font-size:34px">${o}</b></span><span><span class="eyebrow" style="color:var(--navy-dim)">${S.pos||"ポジション"}・特技</span><br><b style="font-size:16px">${sk?S.skills.map(x=>x.n).join("・"):"なし"}</b></span></div>

    ${PR?`<div class="card"><h3 style="font-size:15px">プロ編の記録</h3>
      <div class="pstat"><div><span>プロ</span><b class="num">${PR.years}年</b></div><div><span>通算</span><b class="num">${PR.games}試合</b></div>${S.pos==="GK"?"":`<div><span>得点</span><b class="num">${PR.goals}</b></div>`}<div><span>最高年俸</span><b class="num">${PR.peak?man(PR.peak):"—"}</b></div>${PR.caps?`<div><span>代表</span><b class="num">${PR.caps}試合</b></div>`:""}<div><span>引退</span><b class="num">${PR.retire}歳</b></div></div>

    <div class="card"><h3 style="font-size:15px">未来のあなた（想像）</h3><ol class="future">${fut.map(f=>`<li><b>${f[0]}</b><span>${f[1]}</span></li>`).join("")}</ol><p class="note">ここまでの選び方から想像した未来です。本当の未来は、これからの選び方で何度でも変わります。</p></div>
    <div class="card"><h3 style="font-size:15px">サッカーに関わる仕事、向いているのは</h3><div class="jobs">${jobs.map(([k,v],i)=>`<div class="job"><div class="jh"><b>${i+1}. ${JOBS[k].n}</b><span class="num">${v}%</span></div><span class="jt"><i style="width:${v}%"></i></span><span>${JOBS[k].d}</span><span class="door">入口：${JOBS[k].door}</span></div>`).join("")}</div>
      <p class="note">練習・出来事での選び方と能力から判定しています（試作の判定です）。プロにならなくても、サッカーの仕事はたくさんあります。</p></div>
    <div class="card"><h3 style="font-size:15px">この人生で手に入れた語録</h3><ul class="quotes">${S.quotes.map(k=>`<li>${QUOTES[k]}</li>`).join("")}</ul><p class="note">語録帳 ${SAVE.quotes.length}/${Object.keys(QUOTES).length}・まだ見ていない言葉は、違う道を選ぶと出てきます。</p></div>
    <div class="card"><h3 style="font-size:15px">能力の到達点</h3><div class="stats"><canvas id="radar" width="300" height="300" style="width:150px;height:150px" aria-label="能力の5角形"></canvas>
      <div class="bars">${ST.map(([k,n])=>`<div class="bar"><span>${n}</span><span class="t"><i data-k="${k}"></i></span><span class="v num">${S.s[k]}</span></div>`).join("")}</div></div></div>
    <div class="card"><h3 style="font-size:15px">バッジ ${got.size}/${BADGES.length}・見た結末 ${SAVE.ends.length}種類</h3>
      <div class="badges">${BADGES.map(([k,n,ic])=>`<div class="badge ${got.has(k)?"got":""} ${fresh.includes(k)?"now":""}"><i>${got.has(k)?ic:"？"}</i>${got.has(k)?n:"まだ取っていない"}</div>`).join("")}</div>
      ${newSeeds.length?`<p style="margin:0;font-weight:700;color:var(--accent)">新しい才能の種：${newSeeds.map(x=>x.n).join("・")}。次の人生で持っていけます。</p>`:`<p class="note">バッジを取ると、次の人生に持っていける「才能の種」が増えます。</p>`}</div>
    <div class="card"><h3 style="font-size:15px">この人生の記録</h3><ul class="log">${S.log.slice().reverse().map(l=>`<li class="${l.tone||""}"><b>${l.g}</b><span>${l.txt}</span></li>`).join("")}</ul></div>
    <div class="cta"><b>現実の分かれ道は、セレクションです</b><p>ゲームで迷った進路は、現実では小6の夏〜秋にやってきます。関東・関西のジュニアユースのセレクション日程と締切を、まとめて確認できます。</p><a class="btn main" href="${GIRL?"/clubs/girls":"/selection"}?${Q}" style="display:inline-flex;align-items:center;text-decoration:none">${GIRL?"女子チームを探す":"セレクション情報を見る"}</a></div>
    <div class="links">
      <a href="/member?${Q}&from=ikusei"><b>締切をLINEでお知らせ（会員）</b><i aria-hidden="true">›</i><span>お気に入りクラブの締切リマインド、体格・足型のAI診断。月500円から</span></a>
      <a href="/books/oyako-soccer-note?${Q}"><b>本『9歳から始める 親子サッカーノート』</b><i aria-hidden="true">›</i><span>ゲームの「サッカーノート」を、親子で現実に</span></a>
      <a href="/life/play?${Q}"><b>統計で生きる通常モード（年長〜70歳）</b><i aria-hidden="true">›</i><span>県・誕生月・家庭が統計の確率で決まる「4.5万分の1」</span></a>
    </div>
    <div class="share"><b>この人生を友だちに見せる</b><div class="row"><a class="btn main" id="shLine" href="#" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">LINEで送る</a><a class="btn ghost" id="shX" href="#" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;text-decoration:none">Xに投稿</a><button class="btn ghost" id="copy" type="button">リンクをコピー</button></div><span class="note" id="copied" role="status"></span></div>
    <div class="row"><button class="btn main" id="again">次の人生へ</button></div>
    <p class="note">能力の伸び、ケガのしやすさ、PK、仕事の向き不向きはゲームとしての判定です。プロ入りの人数（1学年約180人）や1年目の年俸上限（1,200万円）、資格の入口は実際の制度に合わせています。語録はこのゲームのオリジナルです。</p>`;
  const msg = gtx(`【4.5万分の1 育成モード${GIRL?"・女子版":""}】${SEASONS[S.start].g}から${S.pos||""}で${SEASONS.length-S.start}シーズン。結末は「${end}」。向いている仕事は「${JOBS[jobs[0][0]].n}」だった。あなたなら、どう育てる？`);
  const link = src => `https://soccer-selection.jp/life/ikusei?utm_source=${src}&utm_medium=share&utm_campaign=ikusei`;
  $("shLine").href = `https://line.me/R/share?text=${encodeURIComponent(msg + "\n" + link("line"))}`;
  $("shX").href = `https://x.com/intent/post?text=${encodeURIComponent(msg)}&url=${encodeURIComponent(link("x"))}`;
  $("copy").onclick = async () => { const t = msg + " " + link("copy"); try { await navigator.clipboard.writeText(t); $("copied").textContent = "コピーしました。LINEやSNSに貼り付けてください"; } catch(e){ $("copied").textContent = t; } };
  drawRadar(); requestAnimationFrame(()=>{ app.querySelectorAll(".bar .t i").forEach(i=>i.style.width = S.s[i.dataset.k]+"%"); });
  $("again").onclick = startScreen; window.scrollTo({top:0});
  if (tier>=4) confetti();
}
function future(path, tier, job){
  const J = JOBS[job].n;
  const at22 = {pro:"プロ4年目。リーグ戦に出場を重ねている。", abroad: tier>=4 ? "海外2クラブ目。現地の言葉で取材に答えるようになった。" : "大学4年。海外での経験を武器に、チームの中心になった。", uni:"大学4年。卒業後の道を、サッカーの経験から考え始めた。", senmon:"トレーナーとして、地元のクラブで選手のケガを見ている。", work:"社会人2年目。平日は仕事、土日は社会人リーグ。"}[path];
  const at30 = tier>=4 ? `30歳。キャリアの後半。引退後は「${J}」の道も考えている。` : `30歳。「${J}」として働きながら、週末はボールを蹴っている。`;
  const at45 = `45歳。${{coach:"教え子がJクラブのアカデミーに合格した。",analyst:"プロクラブの分析チームを率いている。",trainer:"代表チームに帯同するトレーナーになった。",ref:"1級審判として、大きな試合の笛を吹いた。",media:"W杯の試合を、実況席から伝えた。",gear:"自分が開発したスパイクを、子どもたちが履いている。",front:"地元クラブのスタジアムを、満員にした。",nutri:"ユース年代の選手の食事を、家族と一緒に考えている。"}[job]}`;
  const at70 = "70歳。孫とボールを蹴っている。サッカーは、一生の友だちだった。";
  quote("old");
  return [["22歳", at22], ["30歳", at30.replace(/^30歳。/,"")], ["45歳", at45.replace(/^45歳。/,"")], ["70歳", at70.replace(/^70歳。/,"")]];
}

// ── 描画の小物 ───────────────────────────────────────
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function drawRadar(){
  const c = $("radar"); if (!c) return; const x = c.getContext("2d"), W = 300, cx = 150, cy = 154, r = 100;
  const pt = (k, v) => { const a = -Math.PI/2 + k*2*Math.PI/5; return [cx + Math.cos(a)*r*v, cy + Math.sin(a)*r*v]; };
  const line = cssv("--line"), blue = cssv("--blue"), acc = cssv("--accent"), mut = cssv("--muted");
  let p = reduce ? 1 : 0; const prev = S.prev, cur = S.s;
  const frame = () => {
    x.clearRect(0,0,W,W);
    for (const lv of [.25,.5,.75,1]){ x.beginPath(); for (let k=0;k<5;k++){ const [a,b] = pt(k, lv); k?x.lineTo(a,b):x.moveTo(a,b); } x.closePath(); x.strokeStyle = line; x.lineWidth = 2; x.stroke(); }
    const poly = (vals, fill, stroke) => { x.beginPath(); ST.forEach(([k],i)=>{ const [a,b] = pt(i, vals[k]/100); i?x.lineTo(a,b):x.moveTo(a,b); }); x.closePath(); x.fillStyle = fill; x.fill(); x.strokeStyle = stroke; x.lineWidth = 4; x.stroke(); };
    const mid = {}; for (const [k] of ST) mid[k] = prev[k] + (cur[k]-prev[k])*p;
    x.globalAlpha = .9; poly(mid, blue+"33", blue); x.globalAlpha = 1;
    ST.forEach(([k,n],i)=>{ const [a,b] = pt(i, 1.17); x.fillStyle = cur[k]>prev[k]&&p>=1 ? acc : mut; x.font = "700 22px 'Zen Kaku Gothic New',sans-serif"; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText({spd:"速さ",tec:"技術",iq:"判断",phy:"体",men:"心"}[k], a, b); });
    if (p < 1){ p = Math.min(1, p + .05); requestAnimationFrame(frame); }
  };
  frame();
}
let tt; function toast(m){ const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("on"), 2200); }
let ac; function beep(ok){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); const o = ac.createOscillator(), g = ac.createGain(); o.type = "triangle"; o.frequency.value = ok ? 880 : 220; g.gain.setValueAtTime(.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .25); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .26); if (navigator.vibrate) navigator.vibrate(ok?30:[20,40,20]); }catch(e){} }
function confetti(){
  if (reduce) return; const c = $("fx"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#e8590c","#1d5fa8","#8ab8f0","#f2b632","#ffffff"];
  const ps = Array.from({length:120}, () => ({x: innerWidth/2, y: innerHeight*0.35, vx:(R()-0.5)*12, vy:-R()*12-4, s:4+R()*6, c:cols[Math.floor(R()*cols.length)], r:R()*6}));
  let n = 0; const step = () => { x.clearRect(0,0,c.width,c.height); for (const p of ps){ p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += .2; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); } if (++n < 110) requestAnimationFrame(step); else x.clearRect(0,0,c.width,c.height); };
  step();
}
startScreen();
})();
